# Opens a pull request when a package or an action has a newer version, which
# CI then builds and tests before it is merged.
version: 2
updates:
  # Every version is in Directory.Packages.props. Minor and patch updates come
  # as one pull request a week, so that packages released together, such as
  # ASP.NET Core and EF Core, are updated together.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
