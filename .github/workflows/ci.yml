# Builds and tests every pull request, and master after each merge, so that a
# change is known to build and pass before it is merged rather than after. The
# Docker images the server runs are built as well, though never pushed anywhere.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Reading the code is all this workflow does.
permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Windows, as the app references OpenCV's Windows runtime alone, and the
    # tests need LocalDB, which this image has with Visual Studio. Named rather
    # than windows-latest, so that a new image is a change of its own.
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The model is kept in Git LFS, whose downloads count against the
      # account's monthly allowance, so it is fetched once per version of the
      # model and cached after that.
      - name: List the LFS files
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore the LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch the LFS files
        run: git lfs pull

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start LocalDB
        run: sqllocaldb start MSSQLLocalDB

      - name: Restore
        run: dotnet restore

      # Every warning fails the build, so this checks the analyzers as well.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release

  docker:
    name: Build the images
    # The images are built from their own recipe, the Dockerfile, which the job
    # above never reads, so it can break while the tests still pass. Linux, as
    # that is what the images are. Beside the job above rather than after it, so
    # that it adds nothing to the time a run takes.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The Dockerfile stops on finding a pointer in place of the model, so the
      # model is fetched here too, and cached as in the job above.
      - name: List the LFS files
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore the LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch the LFS files
        run: git lfs pull

      - name: Build the API image
        run: docker build --target api --tag animalclassifier-api:ci .

      # Reuses the stages the API image has just built, so it adds only the
      # migrations tool.
      - name: Build the migrations image
        run: docker build --target migrations --tag animalclassifier-migrations:ci .
