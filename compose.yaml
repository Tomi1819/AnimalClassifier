# The API and its database on one machine. Secrets and what differs per machine
# come from a .env file beside this one; see .env.example.
name: animalclassifier

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set it in .env}
    volumes:
      - sql-data:/var/opt/mssql
    # No published port: only what shares this network can reach it.
    networks:
      - database
    mem_limit: 3g
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Brings the database up to date and exits, run by hand before starting a new
  # API with `docker compose run --rm migrations`. The profile keeps it out of a
  # plain `docker compose up`. It alone logs in as sa, as it changes the schema.
  migrations:
    profiles:
      - tools
    image: animalclassifier-migrations:dev
    build:
      context: .
      target: migrations
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=AnimalClassifier;User Id=sa;Password=${SQL_SA_PASSWORD:?set it in .env};TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - database
    cap_drop:
      - ALL

  api:
    image: animalclassifier-api:dev
    build:
      context: .
      target: api
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=AnimalClassifier;User Id=animalclassifier_app;Password=${SQL_APP_PASSWORD:?set it in .env};TrustServerCertificate=True
      Jwt__SecretKey: ${JWT_SECRET_KEY:?set it in .env}
      Email__Host: ${EMAIL_HOST:?set it in .env}
      Email__SenderEmail: ${EMAIL_SENDER:?set it in .env}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:?set it in .env}
      FileUploadSettings__UploadPath: /data/uploads
      DataProtection__KeysPath: /data/keys
      ForwardedHeaders__KnownProxies__0: 172.30.0.10
    volumes:
      - uploads:/data/uploads
      - keys:/data/keys
    depends_on:
      sqlserver:
        condition: service_healthy
    # The database's own network, and the default one for what it reaches outside.
    networks:
      - default
      - database
    mem_limit: 6g
    restart: unless-stopped
    cap_drop:
      - ALL

  # The website and the way in to the API, from the frontend's repository, which
  # has to be cloned beside this one. The only service with a published port, and
  # on this machine alone.
  web:
    image: animalclassifier-web:dev
    build:
      context: ../AnimalClassifier.Frontend
    depends_on:
      - api
    # A fixed address, as the API believes what the callers' addresses are only
    # from a proxy it knows by address.
    networks:
      default:
        ipv4_address: 172.30.0.10
    ports:
      - 127.0.0.1:8080:8080
    mem_limit: 256m
    restart: unless-stopped
    cap_drop:
      - ALL

volumes:
  sql-data:
  uploads:
  keys:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Internal, so that the database cannot reach out to the internet at all.
  database:
    internal: true
